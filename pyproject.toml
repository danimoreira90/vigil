[project]
name = "vigil"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

# System 2 (cognitive / RAG) runtime — ADR-002. Off the AP-1 scorer path on purpose:
# never added to core `dependencies` so the < 200 ms scorer stays lean (HR-7).
# Install with: uv sync --extra system2
[project.optional-dependencies]
system2 = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2",
    "gpt4all>=2.8",
    "openai>=1.50,<2",
    "pydantic>=2.8",
]

# c01 — encoder-vs-decoder typology classification (competency #1). Offline
# analysis/benchmark component, NOT the AP-1 scorer path and NOT a System 2 RAG
# runtime dep: kept in its own extra so neither boundary is crossed. transformers
# and torch resolve transitively via system2's sentence-transformers, but
# classify/ imports them directly so they are declared (CS-13). sentencepiece is
# the one genuinely-new dep — the DeBERTa-v3 tokenizer needs it. Dev/tooling tier
# (off the latency path), so diff review only, no ADR (CS-13). Install with:
# uv sync --extra c01
c01 = [
    "transformers>=4.44",
    "torch>=2.2",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.1",
    "pandas>=3.0.3",
    "pytest>=9.0.3",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "nbclient>=0.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
